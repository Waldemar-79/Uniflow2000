repository_type: pipeline

nf_core_version: 3.5.2

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-pipeline-test_logo_light.png
    - docs/images/nf-core-pipeline-test_logo_light.png
    - docs/images/nf-core-pipeline-test_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .prettierignore
    - .prettierignore
    - .prettierignore
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-pipeline-test_logo_light.png
    - docs/images/nf-core-pipeline-test_logo_light.png
    - docs/images/nf-core-pipeline-test_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - conf/igenomes.config
    - conf/igenomes_ignored.config

template:
  org: waldemar
  name: pipeline-test
  description: APiplelineToTestWithNf-Test
  author: Waldemar
  version: 1.0.0dev
  force: true
  outdir: /home/waldemar/projects/pipelines/pipelinetest
  skip_features:
    - igenomes
    - gpu
    - email
    - adaptivecard
    - slackreport
  is_nfcore: false
