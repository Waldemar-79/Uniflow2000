image: atlassian/default-image:3

pipelines:
  branches:
    main:
      - step:
          name: Create Release Branch and PR
          image: python:3.13
          clone:
            depth: full
          script:
            - apt-get update && apt-get install -y jq
            - pip install python-semantic-release==10.6.1 GitPython==3.1.46 gitdb==4.0.12
            
            - echo "=== Installed versions ==="
            - pip freeze | grep -Ei "semantic|gitpython|gitdb"

            - git config --global user.name "pipeline bot"
            - git config --global user.email "pipeline@atrandi.com"

            - LAST_VERSION=$(semantic-release version --print-last-released)
            - NEXT_VERSION=$(semantic-release version --print) #calculate and get the last version
            
            # no new version
            - |
              if [ -n "$LAST_VERSION" ] && [ "$LAST_VERSION" = "$NEXT_VERSION" ]; then
                echo "No new release required. Nothing to do."
                exit 0
              fi

            - echo "Next version $NEXT_VERSION detected. continue with branch/pr"
            - BRANCH_NAME="release/v${NEXT_VERSION}"

            # create the temp branch and switch to the branch
            - git checkout -b "$BRANCH_NAME"

            - semantic-release version --no-push

            # push branch and tag 
            - git remote set-url origin https://x-token-auth:${BITBUCKET_TOKEN}@bitbucket.org/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}.git
            - git push origin $BRANCH_NAME --tags

            # create the PR
            - |
              PR_RESPONSE=$(curl -sSf -X POST -H "Authorization: Bearer ${BITBUCKET_TOKEN}" \
              -H "Content-Type: application/json" \
              https://api.bitbucket.org/2.0/repositories/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}/pullrequests \
              -d '{
                "title": "chore: release version '"$NEXT_VERSION"'",
                "source": { "branch": { "name": "'"$BRANCH_NAME"'" } },
                "destination": { "branch": { "name": "main" } },
                "description": "Automated release update for nextflow.config and CHANGELOG.md.",
                "close_source_branch": true
              }')
            
            # get the new PR-ID
            - PR_ID=$(echo "$PR_RESPONSE" | jq '.id')
            - echo "Pull Request create ${PR_ID} successful"
          
            # next step - automated merge back to the main

      # Optional: Second Step, if you want to do something after the trigger
      # - step:
      #     name: More Actions
      #     script:
      #       - echo "Pipeline getriggerd – End"
