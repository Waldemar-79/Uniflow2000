image: atlassian/default-image:3

pipelines:
  branches:
    main:
      - step:
          name: Trigger E2E Tests
          script:
            - echo "Triggering pipeline_e2e_tests"
            - |
              curl -X POST \
                -u "waldemarvollmer:$API_TOKEN" -H "Content-Type: application/json" https://api.bitbucket.org/2.0/repositories/waldemarvollmer/pipeline_e2e_tests/pipelines/ -d '{
                  "target": {
                    "type": "pipeline_ref_target",
                    "ref_type": "branch",
                    "ref_name": "main"
                  },
                  "selector": {
                    "type": "custom",
                    "pattern": "run-e2e-tests"
                  }
                }'
